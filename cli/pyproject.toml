[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsql"
version = "2.0.0"
description = "UNSQL — an AI layer that sits directly over your database (natural language to dialect-correct SQL)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
postgresql = ["psycopg2-binary>=2.9"]
mysql = ["mysql-connector-python>=8.3"]
mariadb = ["mysql-connector-python>=8.3"]
mssql = ["pyodbc>=5.1"]
oracle = ["oracledb>=2.0"]
db2 = ["ibm-db>=3.2"]
snowflake = ["snowflake-connector-python>=3.7"]
access = ["pyodbc>=5.1"]
all = [
  "psycopg2-binary>=2.9",
  "mysql-connector-python>=8.3",
  "pyodbc>=5.1",
  "oracledb>=2.0",
  "snowflake-connector-python>=3.7",
]

[project.scripts]
unsql = "unsql.repl:main"

[tool.setuptools.packages.find]
include = ["unsql*"]
